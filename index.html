<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>F1 Manager 2026</title>
<meta name="theme-color" content="#02040a">
<meta name="color-scheme" content="dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Orbitron:wght@600;700;800&display=swap" rel="stylesheet">
<style>






:root{
  --bg:#02040a;
  --panel:rgba(12,16,26,0.78);
  --panel2:#0f141f;
  --line:rgba(255,255,255,0.055);
  --line2:rgba(255,255,255,0.10);
  --text:#f5f7fb;
  --muted:#8a92a6;
  --muted2:#5c6578;
  --a:#ff1e12;
  --a-deep:#c40800;
  --cyan:#3ef0e0;
  --gold:#e8c36a;
  --side-w:268px;
  --font:"Inter",system-ui,-apple-system,BlinkMacSystemFont,sans-serif;
  --display:"Orbitron","Inter",system-ui,sans-serif;
  --ease:cubic-bezier(0.22,1,0.36,1);
  --out:cubic-bezier(0.16,1,0.3,1);
  --blur:28px;
  --r:20px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
::selection{background:color-mix(in srgb,var(--a) 45%,transparent);color:#fff}
body{
  min-height:100vh;color:var(--text);font:14.5px/1.55 var(--font);
  background:var(--bg);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  overflow-x:hidden;
}
body::before{
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(ellipse 100% 60% at 90% -20%, color-mix(in srgb,var(--a) 22%, transparent), transparent 55%),
    radial-gradient(ellipse 80% 50% at -10% 100%, color-mix(in srgb,var(--cyan) 10%, transparent), transparent 50%),
    radial-gradient(ellipse 60% 40% at 50% 40%, rgba(18,22,40,0.45), transparent 70%),
    linear-gradient(180deg,#050812 0%,#02040a 50%,#010208 100%);
}
#app{position:relative;z-index:1;min-height:100vh}

/* Carbon fiber overlay utility */
.carbon{
  background-image:
    repeating-linear-gradient(45deg, transparent, transparent 2px, rgba(0,0,0,0.12) 2px, rgba(0,0,0,0.12) 4px),
    repeating-linear-gradient(-45deg, transparent, transparent 2px, rgba(255,255,255,0.015) 2px, rgba(255,255,255,0.015) 4px);
}

@keyframes shellIn{from{opacity:0;transform:translateY(24px) scale(0.97)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes slideL{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:none}}
@keyframes barIn{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes shimmer{0%{background-position:200% center}100%{background-position:-200% center}}
@keyframes pulseRing{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--a) 55%,transparent)}70%{box-shadow:0 0 0 14px transparent}100%{box-shadow:0 0 0 0 transparent}}
@keyframes breath{0%,100%{opacity:0.5;transform:scale(1)}50%{opacity:1;transform:scale(1.05)}}
@keyframes confFall{0%{transform:translateY(-8vh) rotate(0);opacity:1}100%{transform:translateY(110vh) rotate(var(--r));opacity:0}}
@keyframes lightOn{from{transform:scale(0.5);opacity:0.2}to{transform:scale(1);opacity:1}}
@keyframes splashFade{to{opacity:0;transform:scale(1.05)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes orbFloat{0%,100%{transform:translate(0,0)}50%{transform:translate(12px,-18px)}}
@keyframes flashIn{0%{opacity:0}40%{opacity:1}100%{opacity:0}}
@keyframes borderSpin{to{transform:rotate(360deg)}}

.shell{max-width:1200px;margin:0 auto;padding:28px 20px 60px;animation:shellIn 0.7s var(--out) both}
.menu-shell{max-width:1140px}

h1{font-family:var(--display);font-weight:800;font-size:clamp(28px,4.8vw,44px);letter-spacing:0.06em;line-height:1.05;margin:0}
h2{
  font-family:var(--display);font-size:11px;font-weight:700;letter-spacing:0.2em;
  text-transform:uppercase;color:var(--muted);margin:30px 0 14px;
  display:flex;align-items:center;gap:14px;
}
h2::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line2),transparent 80%)}
.lead{color:#a5aec2;max-width:48ch;margin:0.6em 0 1.3em;font-size:15px;line-height:1.65;font-weight:400}
.mut{color:var(--muted);font-size:13px}
.hero-badge{
  display:inline-flex;align-items:center;gap:8px;
  font-size:10px;font-weight:700;letter-spacing:0.24em;
  color:var(--cyan);
  border:1px solid color-mix(in srgb,var(--cyan) 30%,transparent);
  background:linear-gradient(135deg,color-mix(in srgb,var(--cyan) 10%,transparent),transparent);
  padding:6px 14px;border-radius:100px;margin-bottom:16px;
  animation:rise 0.55s var(--ease) both;
  box-shadow:0 0 24px color-mix(in srgb,var(--cyan) 8%,transparent);
}

/* Buttons */
button,select{
  font:inherit;font-weight:600;cursor:pointer;color:var(--text);
  background:rgba(16,20,32,0.92);border:1px solid var(--line2);
  border-radius:11px;padding:10px 18px;
  transition:transform 0.22s var(--ease),border-color 0.22s,background 0.22s,box-shadow 0.28s;
}
button:hover{border-color:color-mix(in srgb,var(--a) 50%,var(--line2));background:rgba(22,26,40,0.95);transform:translateY(-1px)}
button:active{transform:scale(0.97)}
button:disabled{opacity:0.3;cursor:not-allowed;transform:none!important;box-shadow:none!important}
button.p{
  position:relative;overflow:hidden;
  background:linear-gradient(135deg,#ff3b30 0%,var(--a) 40%,var(--a-deep) 100%);
  border:1px solid color-mix(in srgb,var(--a) 50%,transparent);color:#fff;
  box-shadow:0 6px 28px color-mix(in srgb,var(--a) 42%,transparent),inset 0 1px 0 rgba(255,255,255,0.22);
  text-shadow:0 1px 2px rgba(0,0,0,0.3);
}
button.p::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,0.18) 50%,transparent 60%);
  background-size:200% 100%;pointer-events:none;
}
button.p:hover{
  filter:brightness(1.1) saturate(1.08);
  box-shadow:0 10px 40px color-mix(in srgb,var(--a) 55%,transparent),inset 0 1px 0 rgba(255,255,255,0.28);
  transform:translateY(-2px);
}
button.p.big{padding:16px 34px;font-size:15px;border-radius:14px;letter-spacing:0.03em}
button.p.pulse{}
button.ghost{background:transparent;border-color:var(--line2);color:var(--muted)}
button.ghost:hover{color:var(--text);border-color:rgba(255,255,255,0.22);background:rgba(255,255,255,0.03)}
select{border-radius:10px;min-width:132px;padding:9px 12px}

/* Page flash transition */
.page-flash{
  position:fixed;inset:0;z-index:200;pointer-events:none;
  background:radial-gradient(circle at center,rgba(255,255,255,0.12),transparent 55%);
  opacity:0;
}
.page-flash.on{animation:flashIn 0.5s var(--ease) forwards}

/* ========== SPLASH ========== */
.splash{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  padding:28px 16px;position:relative;overflow:hidden;
}
.ambient-cv{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.splash-orb{
  position:absolute;border-radius:50%;pointer-events:none;z-index:0;
  
}
.splash-orb.o1{width:440px;height:440px;top:2%;right:6%;background:radial-gradient(circle,color-mix(in srgb,var(--a) 35%,transparent),transparent 68%)}
.splash-orb.o2{width:380px;height:380px;bottom:4%;left:2%;background:radial-gradient(circle,color-mix(in srgb,var(--cyan) 22%,transparent),transparent 68%)}
.splash-card{
  position:relative;z-index:2;width:min(460px,100%);
  background:linear-gradient(165deg,rgba(18,22,36,0.88),rgba(8,11,20,0.94));
  border:1px solid var(--line2);border-radius:28px;padding:40px 32px 32px;
  box-shadow:
    0 50px 120px rgba(0,0,0,0.7),
    0 0 0 1px rgba(255,255,255,0.04),
    inset 0 1px 0 rgba(255,255,255,0.08);
  animation:shellIn 0.75s var(--out) both;
}
.splash-card::before{
  content:"";position:absolute;top:0;left:10%;right:10%;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,0.35),transparent);
}
.splash-card::after{
  content:"";position:absolute;inset:0;border-radius:28px;pointer-events:none;
  background:linear-gradient(135deg,rgba(255,255,255,0.04),transparent 40%);
}
.splash-card h1{
  font-size:clamp(32px,7vw,42px);margin-bottom:10px;position:relative;
  background:linear-gradient(105deg,#fff 0%,#fff 20%,var(--a) 48%,var(--cyan) 72%,#fff 100%);
  background-size:100% auto;-webkit-background-clip:text;background-clip:text;color:transparent;
  
}
.splash-sub{color:var(--muted);font-size:14.5px;margin-bottom:6px;line-height:1.6}
.splash-lights{display:flex;gap:11px;justify-content:center;margin:24px 0 20px}
.splash-lights i{
  width:17px;height:17px;border-radius:50%;
  background:#160a0a;border:1px solid #3a1616;
  box-shadow:inset 0 0 10px #000;transition:transform 0.35s var(--ease),opacity 0.35s var(--ease),box-shadow 0.35s var(--ease),border-color 0.35s var(--ease);
}
.splash-lights i.on{
  background:var(--a);border-color:#ff7a6e;
  box-shadow:0 0 18px var(--a),0 0 40px color-mix(in srgb,var(--a) 50%,transparent);
  animation:lightOn 0.28s var(--ease) both;
}
.splash-lights.green i{background:#0a1c16;border-color:#1a3d2e}
.splash-lights.green i.on{
  background:#2ee6a0;border-color:#8fffd0;
  box-shadow:0 0 18px #2ee6a0,0 0 40px #2ee6a055;
}
.captcha-box{
  background:rgba(4,7,14,0.75);border:1px solid var(--line);
  border-radius:18px;padding:18px;margin-bottom:16px;
  box-shadow:inset 0 0 40px rgba(0,0,0,0.35);
}
.captcha-label{
  font-size:10px;letter-spacing:0.18em;text-transform:uppercase;color:var(--muted);
  margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;
}
.captcha-label button{padding:5px 12px;font-size:11px;border-radius:8px}
.captcha-canvas-wrap{
  border-radius:14px;overflow:hidden;border:1px solid rgba(255,255,255,0.06);
  background:#060a12;margin-bottom:14px;
  box-shadow:inset 0 0 40px rgba(0,0,0,0.55);
}
#captchaCv{display:block;width:100%;height:auto}
.captcha-row input{
  width:100%;background:rgba(6,10,18,0.95);border:1px solid var(--line2);
  border-radius:14px;color:var(--text);
  font:600 18px/1.2 var(--display);letter-spacing:0.32em;
  text-transform:uppercase;padding:14px 16px;outline:none;text-align:center;
  transition:border-color 0.2s,box-shadow 0.25s;
}
.captcha-row input:focus{
  border-color:color-mix(in srgb,var(--a) 55%,var(--line2));
  box-shadow:0 0 0 4px color-mix(in srgb,var(--a) 16%,transparent);
}
.captcha-row input.bad{border-color:#ff4d4d;animation:shake 0.4s ease}
.captcha-err{color:#ff8585;font-size:12.5px;margin-top:10px;min-height:1.2em;opacity:0;transition:opacity 0.2s}
.captcha-err.show{opacity:1}
.splash-actions .p{width:100%}
.splash-foot{margin-top:20px;text-align:center;font-size:11px;color:var(--muted2);line-height:1.6}
body.splash-out #app{animation:splashFade 0.42s var(--ease) forwards}

/* ========== MENU ========== */
.hero{text-align:center;padding:44px 12px 36px;animation:rise 0.7s var(--out) both}
.hero .lead{margin:0.6em auto 1.3em}
.hero h1{
  background:linear-gradient(105deg,#fff 10%,var(--a) 42%,var(--cyan) 68%,#fff 95%);
  background-size:100% auto;-webkit-background-clip:text;background-clip:text;color:transparent;
  
}
.team-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;margin-top:10px}
.team-card{
  background:linear-gradient(165deg,rgba(16,20,32,0.95),rgba(6,9,16,0.98));
  border:1px solid var(--line);border-radius:18px;overflow:hidden;
  display:flex;flex-direction:column;
  animation:rise 0.55s var(--out) both;animation-delay:var(--d,0s);
  transition:transform 0.4s var(--ease),border-color 0.3s,box-shadow 0.4s;
}
.team-card:hover{
  transform:translateY(-8px) scale(1.015);
  border-color:color-mix(in srgb,var(--tc) 55%,var(--line));
  box-shadow:
    0 28px 70px rgba(0,0,0,0.6),
    0 0 0 1px color-mix(in srgb,var(--tc) 25%,transparent),
    0 0 50px color-mix(in srgb,var(--tc) 15%,transparent);
}
.team-stripe{height:3px;background:var(--tc);box-shadow:0 0 28px var(--tc)}
.team-body{padding:20px;display:flex;flex-direction:column;flex:1}
.team-body h3{font-size:16.5px;font-weight:700;letter-spacing:0.015em;margin-bottom:4px}
.team-meta{font-size:12px;color:var(--muted);margin-bottom:14px}
.drivers{font-size:13.5px;color:#c5cbd8;margin-bottom:18px;flex:1;line-height:1.7}
.drivers .num{font-weight:700;margin-right:4px}
.drivers em{color:var(--muted2);font-style:normal;font-size:11px;margin-left:4px}
.team-body button{width:100%;margin-top:auto}

.mode-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:22px;max-width:760px;margin:28px auto 0}
.mode-card{
  position:relative;background:linear-gradient(165deg,rgba(16,20,32,0.96),rgba(6,9,16,0.99));
  border:1px solid var(--line);border-radius:22px;padding:28px 24px 24px;
  display:flex;flex-direction:column;gap:14px;cursor:pointer;
  transition:transform 0.4s var(--ease),border-color 0.3s,box-shadow 0.4s;
  animation:rise 0.6s var(--out) both;
}
.mode-card:hover{
  transform:translateY(-10px) scale(1.02);
  border-color:color-mix(in srgb,var(--mc) 50%,var(--line));
  box-shadow:0 30px 70px rgba(0,0,0,0.55),0 0 0 1px color-mix(in srgb,var(--mc) 22%,transparent),0 0 48px color-mix(in srgb,var(--mc) 14%,transparent);
}
.mode-card .mode-icon{
  width:52px;height:52px;border-radius:14px;display:grid;place-items:center;
  font-size:24px;background:color-mix(in srgb,var(--mc) 16%,transparent);
  border:1px solid color-mix(in srgb,var(--mc) 35%,transparent);
  box-shadow:0 0 24px color-mix(in srgb,var(--mc) 12%,transparent);
}
.mode-card h3{font-family:var(--display);font-size:18px;letter-spacing:0.08em;font-weight:700;margin:0}
.mode-card p{color:var(--muted);font-size:13.5px;line-height:1.6;margin:0;flex:1}
.mode-card .mode-tags{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 8px}
.mode-card .mode-tags span{
  font-size:10px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;
  padding:4px 10px;border-radius:100px;
  background:color-mix(in srgb,var(--mc) 12%,transparent);
  border:1px solid color-mix(in srgb,var(--mc) 28%,transparent);color:#d0d6e4;
}
.mode-card button{width:100%;margin-top:auto}
.mode-back{display:inline-flex;align-items:center;gap:6px;margin-bottom:8px;font-size:13px;color:var(--muted);background:none;border:none;cursor:pointer;padding:4px 0}
.mode-back:hover{color:var(--text)}
.mode-badge{
  display:inline-flex;align-items:center;gap:6px;font-size:10px;font-weight:700;letter-spacing:0.18em;
  padding:5px 12px;border-radius:100px;margin-bottom:10px;
  border:1px solid color-mix(in srgb,var(--mc,#3ef0e0) 30%,transparent);
  background:linear-gradient(135deg,color-mix(in srgb,var(--mc,#3ef0e0) 12%,transparent),transparent);
  color:var(--mc,#3ef0e0);
}




/* === Premium 2D F1 model === */
.f1car-stage{
  position:relative;width:100%;
  aspect-ratio:800/425;
  max-height:200px;
  display:flex;align-items:center;justify-content:center;
}
.f1car-color{
  position:absolute;inset:8% 2% 12% 2%;
  border-radius:40% 30% 20% 25% / 60% 40% 50% 40%;
  opacity:0.42;
  mix-blend-mode:multiply;
  pointer-events:none;
  filter:blur(1px);
  z-index:1;
}
.f1car-sil{
  position:relative;z-index:2;
  width:100%;height:100%;object-fit:contain;
  display:block;
  filter: drop-shadow(0 10px 18px rgba(0,0,0,0.4));
  transition: transform 0.45s var(--ease), filter 0.35s;
  pointer-events:none;
}
/* darken tires slightly for contrast */
.car-premium .f1car-sil{
  filter: drop-shadow(0 12px 22px rgba(0,0,0,0.5)) contrast(1.05) saturate(1.05);
}
.f1car-hots-svg{
  position:absolute;inset:0;z-index:3;
  width:100%;height:100%;
  pointer-events:none;
}
.f1car-hots-svg .car-hot-shape{
  fill: transparent;
  stroke: transparent;
  stroke-width:0;
  pointer-events:auto;
  cursor:pointer;
  transition: fill 0.2s, stroke 0.2s;
}
.f1car-hots-svg .car-hot-shape:hover{
  fill: color-mix(in srgb, var(--team, #ff1e12) 28%, transparent);
  stroke: color-mix(in srgb, var(--team, #ff1e12) 70%, #fff);
  stroke-width:2.5;
}
.f1car-hots-svg .car-hot-shape.on{
  fill: color-mix(in srgb, var(--team, #ff1e12) 38%, transparent);
  stroke: var(--team, #ff1e12);
  stroke-width:3;
  filter: drop-shadow(0 0 8px color-mix(in srgb, var(--team,#ff1e12) 50%, transparent));
}

.team-mini .f1car-stage{max-height:78px}
.team-mini .f1car-hots-svg{display:none}
.team-mini .f1car-color{opacity:0.5}
.car-modal-preview .f1car-stage{max-height:150px}
.car-modal-preview .f1car-hots-svg{display:none}

/* Hide old rectangular hots if any remain */
.car-hots{display:none !important}

/* Animations */
@keyframes carFloat{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-6px)}
}
@keyframes carIn{
  from{opacity:0;transform:translateX(-20px) scale(0.95)}
  to{opacity:1;transform:none}
}
.car-anim .f1car-stage{
  animation: carFloat 4s ease-in-out infinite, carIn 0.6s var(--out) both;
}
.car-anim:hover .f1car-stage{
  transform: translateY(-10px) scale(1.04);
  animation-play-state: paused;
}
.car-anim:hover .f1car-sil{
  filter: drop-shadow(0 16px 28px rgba(0,0,0,0.55)) brightness(1.04);
}
.page-hub .car-anim .f1car-stage{animation: carFloat 4.5s ease-in-out infinite}

/* Graphics quality */
html.gq-0 .car-anim .f1car-stage{animation:none}
html.gq-0 .f1car-sil{filter:none}
html.gq-0 .f1car-color{opacity:0.25;filter:none}
html.gq-0 .mode-card,html.gq-0 .team-card{transition:none !important}
html.gq-0 .team-card:hover{transform:none}
html.gq-1 .car-anim .f1car-stage{animation: carIn 0.45s var(--out) both}
html.gq-2 .f1car-ref{filter:drop-shadow(0 8px 20px rgba(0,0,0,0.25))}
html.gq-2 .mode-card:hover,html.gq-2 .team-card:hover{
  box-shadow:0 28px 70px rgba(0,0,0,0.55),0 0 40px color-mix(in srgb,var(--tc,var(--a)) 18%,transparent);
}
.sfx-tog select{
  background:var(--panel2);border:1px solid var(--line2);color:var(--text);
  border-radius:8px;padding:5px 8px;font-size:12px;margin-left:4px
}

/* ========== HUB ========== */
.hub-shell{display:grid;grid-template-columns:var(--side-w) 1fr;gap:0;max-width:1280px;padding:0;min-height:100vh}
.side{
  background:linear-gradient(180deg,rgba(8,11,20,0.98),rgba(3,5,12,0.99));
  border-right:1px solid var(--line);
  padding:24px 14px;display:flex;flex-direction:column;gap:20px;
  position:sticky;top:0;height:100vh;animation:slideL 0.6s var(--out) both;
}
.side-brand{display:flex;align-items:center;gap:12px;padding:6px 10px}
.logo-dot{
  width:12px;height:12px;border-radius:50%;flex-shrink:0;
  box-shadow:0 0 0 4px color-mix(in srgb,var(--a) 22%,transparent),0 0 20px var(--a);
}
.side-brand strong{display:block;font-size:13px;font-weight:700;line-height:1.25;letter-spacing:0.02em}
.side-brand small{color:var(--muted);font-size:11px;letter-spacing:0.05em}
.side-nav{display:flex;flex-direction:column;gap:4px;flex:1}
.side-nav button{
  display:flex;align-items:center;gap:12px;width:100%;
  background:transparent;border:1px solid transparent;border-radius:13px;
  padding:12px 14px;color:var(--muted);font-weight:500;text-align:left;
  transition:transform 0.22s var(--ease),background-color 0.22s var(--ease),border-color 0.22s var(--ease),color 0.22s var(--ease),opacity 0.22s var(--ease);
}
.side-nav button .ic{width:22px;text-align:center;opacity:0.7;font-size:14px}
.side-nav button:hover{background:rgba(255,255,255,0.035);color:var(--text);transform:none;border-color:transparent}
.side-nav button.on{
  background:color-mix(in srgb,var(--a) 12%,transparent);
  border-color:color-mix(in srgb,var(--a) 24%,transparent);
  color:#fff;box-shadow:inset 3px 0 0 var(--a);
}
.side-foot{display:flex;flex-direction:column;gap:9px;padding-top:12px;border-top:1px solid var(--line)}
.stat-pill{
  background:rgba(10,14,24,0.85);border:1px solid var(--line);
  border-radius:14px;padding:13px 14px;
  display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.03);
}
.stat-pill span{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:0.14em;width:100%}
.stat-pill b{font-family:var(--display);font-size:26px;font-weight:700;letter-spacing:0.02em}
.stat-pill small{color:var(--muted);font-size:12px}
.sfx-tog{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px;cursor:pointer;padding:4px 2px}

.main-col{padding:28px 28px 52px;animation:rise 0.65s var(--out) 0.05s both}
.topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;flex-wrap:wrap;margin-bottom:18px}
.season-progress{margin-bottom:14px}
.sp-label{font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.sp-bar{
  height:5px;background:rgba(255,255,255,0.05);border-radius:99px;overflow:hidden;
  width:min(320px,74vw);box-shadow:inset 0 1px 3px rgba(0,0,0,0.5);
}
.sp-bar i{
  display:block;height:100%;
  background:linear-gradient(90deg,var(--a),var(--cyan));
  transform-origin:left;animation:barIn 1.15s var(--out) both;border-radius:99px;
  box-shadow:0 0 18px color-mix(in srgb,var(--a) 50%,transparent);
}
.next-card{
  background:linear-gradient(145deg,rgba(16,20,32,0.92),rgba(8,11,20,0.96));
  border:1px solid var(--line);border-radius:16px;padding:15px 17px;
  border-left:3px solid var(--a);max-width:400px;
  box-shadow:0 12px 40px rgba(0,0,0,0.3);
}
.next-card.done{border-left-color:var(--cyan)}
.nc-kicker{font-size:10px;letter-spacing:0.18em;text-transform:uppercase;color:var(--muted)}
.nc-title{font-weight:700;font-size:17px;margin:4px 0;letter-spacing:0.015em}
.nc-meta{font-size:12px;color:var(--muted)}
.tip-bar{
  background:linear-gradient(100deg,color-mix(in srgb,var(--cyan) 8%,transparent),rgba(10,14,24,0.7));
  border:1px solid color-mix(in srgb,var(--cyan) 18%,var(--line));
  border-radius:14px;padding:12px 16px;font-size:13px;color:#b3bbce;
  margin-bottom:22px;animation:rise 0.55s var(--ease) 0.1s both;
}
.panel{animation:rise 0.5s var(--out) both}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.card{
  background:linear-gradient(165deg,rgba(14,18,30,0.9),rgba(8,11,18,0.96));
  border:1px solid var(--line);border-radius:14px;padding:18px;
  position:relative;overflow:hidden;
  transition:transform 0.32s var(--ease),border-color 0.25s,box-shadow 0.32s;
}
.card::before{
  content:"";position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,var(--a),transparent 75%);opacity:0.85;
}
.card:hover{
  transform:translateY(-5px);
  border-color:color-mix(in srgb,var(--a) 32%,var(--line));
  box-shadow:0 22px 55px rgba(0,0,0,0.5),0 0 0 1px color-mix(in srgb,var(--a) 12%,transparent);
}
.card.stagger{animation:rise 0.5s var(--out) both;animation-delay:var(--d,0s)}
.card b{font-size:15px;display:block;letter-spacing:0.015em}
.bar{
  height:6px;background:rgba(255,255,255,0.05);border-radius:4px;overflow:hidden;margin:10px 0;
  box-shadow:inset 0 1px 2px rgba(0,0,0,0.4);
}
.bar i{
  display:block;height:100%;
  background:linear-gradient(90deg,var(--a),color-mix(in srgb,var(--a) 35%,#fff));
  border-radius:4px;box-shadow:0 0 14px color-mix(in srgb,var(--a) 50%,transparent);
  transform-origin:left;animation:barIn 1s var(--out) both;
}

.compare{margin:8px 0 24px}
.cmp-rows{display:flex;flex-direction:column;gap:10px}
.cmp-row{display:grid;grid-template-columns:150px 1fr 42px;gap:12px;align-items:center;font-size:13px}
.cmp-row.me .cmp-name{font-weight:700;color:#fff}
.cmp-bar{height:7px;background:rgba(255,255,255,0.05);border-radius:4px;overflow:hidden}
.cmp-bar i{display:block;height:100%;border-radius:4px;transform-origin:left;animation:barIn 0.9s var(--out) both;box-shadow:0 0 12px currentColor}
.cmp-val{font-variant-numeric:tabular-nums;color:var(--muted);text-align:right;font-weight:600}

.pilot-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.pilot-stats div{
  background:rgba(5,8,16,0.85);border:1px solid var(--line);
  border-radius:11px;padding:11px 6px;text-align:center;
}
.pilot-stats em{display:block;font-style:normal;font-size:9px;color:var(--muted);letter-spacing:0.1em;text-transform:uppercase;margin-bottom:3px}
.pilot-stats strong{font-size:17px;font-weight:700;font-family:var(--display)}

.hist{display:flex;flex-wrap:wrap;gap:8px}
.hist-item{
  background:rgba(10,14,24,0.9);border:1px solid var(--line);
  border-radius:11px;padding:10px 14px;
  display:flex;align-items:center;gap:10px;font-size:13px;
  transition:border-color 0.2s,transform 0.2s;
}
.hist-item:hover{border-color:var(--line2);transform:translateY(-1px)}
.hist-gp{color:var(--muted)}
.hist-pos{font-weight:700;font-family:var(--display);font-size:14px}
.pos-1,.pos-2,.pos-3{color:var(--gold);text-shadow:0 0 12px color-mix(in srgb,var(--gold) 40%,transparent)}
.hist-pts{color:var(--cyan);font-weight:600}

.sc{
  overflow-x:auto;border:1px solid var(--line);border-radius:16px;
  background:rgba(6,9,16,0.88);
}
table{width:100%;border-collapse:collapse;font-size:13px}
th{
  text-align:left;padding:13px 15px;
  font-size:10px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;
  color:var(--muted);background:rgba(10,14,24,0.95);
  border-bottom:1px solid var(--line2);
}
td{padding:11px 15px;border-bottom:1px solid rgba(255,255,255,0.025);white-space:nowrap}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(255,255,255,0.02)}
tr.me td{background:color-mix(in srgb,var(--a) 9%,transparent)!important}
tr.me{box-shadow:inset 3px 0 0 var(--a)}

.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:8px;vertical-align:middle;box-shadow:0 0 12px currentColor}
.ty{
  display:inline-flex;align-items:center;justify-content:center;
  min-width:22px;height:22px;border-radius:50%;border:2px solid currentColor;
  font:700 11px/1 Arial;margin-right:4px;vertical-align:middle;
}
.ty.S{color:#e10600;background:rgba(225,6,0,0.12)}
.ty.M{color:#ffd12e;background:rgba(255,209,46,0.12)}
.ty.H{color:#eee;background:rgba(255,255,255,0.08)}
.ty.I{color:#39b54a;background:rgba(57,181,74,0.12)}
.ty.W{color:#2f6bff;background:rgba(47,107,255,0.12)}

.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:980px){
  .hub-shell{grid-template-columns:1fr}
  .side{position:relative;height:auto;border-right:none;border-bottom:1px solid var(--line)}
  .side-nav{flex-direction:row;flex-wrap:wrap}
  .side-nav button{width:auto}
  .two{grid-template-columns:1fr}
}

.race-shell,.live-shell,.result-shell{max-width:1140px}
.race-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:20px;flex-wrap:wrap}
.strat-tip,.tyre-legend{
  background:linear-gradient(145deg,rgba(14,18,28,0.92),rgba(8,11,18,0.96));
  border:1px solid var(--line);border-radius:16px;padding:15px 17px;
  margin-bottom:18px;font-size:13.5px;color:#b0b8ca;
}
.tyre-legend{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px}
.actions{margin-top:24px;display:flex;gap:10px;flex-wrap:wrap}

.live-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.live-meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.badge{
  display:inline-flex;align-items:center;gap:5px;
  background:rgba(8,11,20,0.92);border:1px solid var(--line);
  border-radius:100px;padding:5px 13px;font-size:12px;font-weight:600;color:var(--muted);
}
.badge b{color:var(--text)}
.speed-ctrl{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.auto-lab{font-size:12px;color:var(--muted);margin-left:6px}
.ctrl-grid{display:grid;gap:10px;margin-top:12px}
.ctrl-grid label{font-size:10px;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted);display:grid;gap:5px}
.ctrl-grid select,.ctrl-grid button{width:100%}
.map-wrap{
  background:#04070e;border-radius:14px;overflow:hidden;border:1px solid var(--line);
  box-shadow:inset 0 0 60px rgba(0,0,0,0.75);
}
.map-cap{margin-top:10px;font-size:12px}
.timing-card{padding:8px 6px}
.race-log{
  margin-top:16px;max-height:140px;overflow-y:auto;font-size:12.5px;color:var(--muted);
  background:rgba(8,11,18,0.9);border:1px solid var(--line);
  border-radius:14px;padding:12px 14px;line-height:1.65;
}

.rw{position:absolute;left:0;right:0;height:30px;display:flex;align-items:center;gap:8px;padding:0 10px;border-radius:8px;transition:transform 0.7s var(--ease);font-size:13px}
.rw b{width:24px;font-variant-numeric:tabular-nums;font-weight:700;color:var(--muted)}
.rw .nm{flex:1;font-weight:500}
.rw .gp{width:78px;text-align:right;font-variant-numeric:tabular-nums;color:var(--muted);font-size:12px}
.rw.me{background:color-mix(in srgb,var(--a) 14%,transparent);box-shadow:inset 3px 0 0 var(--a)}
.rw.ko{opacity:0.3}

.lr{display:grid;grid-template-columns:28px 1fr 74px 40px;gap:8px;align-items:center;padding:7px 12px;border-radius:10px;animation:rise 0.35s var(--ease) both;animation-delay:var(--d)}
.lr.me{background:color-mix(in srgb,var(--a) 11%,transparent)}

.result-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:24px 0}
.rs-item{
  background:linear-gradient(165deg,rgba(14,18,30,0.92),rgba(8,11,18,0.96));
  border:1px solid var(--line);border-radius:18px;padding:22px 16px;text-align:center;
  animation:rise 0.55s var(--out) both;
  box-shadow:0 12px 40px rgba(0,0,0,0.25);
}
.rs-item em{display:block;font-style:normal;font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.rs-item strong{font-family:var(--display);font-size:28px;font-weight:700;letter-spacing:0.02em}
.rs-item.pos strong{color:#3dd68c;text-shadow:0 0 20px rgba(61,214,140,0.35)}
.rs-item.neg strong{color:#ff6b6b}
.champ-banner{
  text-align:center;padding:36px 24px;margin-bottom:24px;
  background:linear-gradient(150deg,color-mix(in srgb,var(--a) 20%,rgba(10,14,24,0.95)),rgba(6,9,16,0.98));
  border:1px solid color-mix(in srgb,var(--a) 30%,var(--line));
  border-radius:22px;animation:rise 0.6s var(--out) both;
  box-shadow:0 24px 70px rgba(0,0,0,0.4),inset 0 1px 0 rgba(255,255,255,0.07);
}
.cb-label{font-size:10px;letter-spacing:0.24em;text-transform:uppercase;color:var(--muted)}
.cb-name{font-family:var(--display);font-size:32px;font-weight:800;margin:10px 0;letter-spacing:0.05em}
.cb-sub{color:var(--muted)}

.confetti-layer{position:fixed;inset:0;pointer-events:none;z-index:100;overflow:hidden}
.confetti-layer i{
  position:absolute;top:-5vh;width:9px;height:13px;background:var(--c);
  left:var(--x);animation:confFall var(--d) linear forwards;
  border-radius:2px;box-shadow:0 0 8px var(--c);
}

#toasts{position:fixed;right:18px;top:18px;display:grid;gap:10px;z-index:50;max-width:340px}
.toast{
  background:rgba(12,16,28,0.94);
  border:1px solid var(--line2);border-left:3px solid var(--a);
  padding:14px 16px;border-radius:14px;
  box-shadow:0 20px 50px rgba(0,0,0,0.5);
  animation:rise 0.35s var(--ease) both,toastOut 0.4s 3.5s forwards;
  font-size:13.5px;
}
@keyframes toastOut{to{opacity:0;transform:translateX(40px)}}

svg text{font:3.2px var(--font);fill:#fff;text-anchor:middle;pointer-events:none;opacity:0.9}
.foot{margin-top:44px;padding-top:18px;border-top:1px solid var(--line);font-size:12px;color:var(--muted2)}
.foot small{color:inherit;display:block}

input[type=range]{width:100%;accent-color:var(--a);margin:8px 0}
input[type=number]{
  background:rgba(10,14,24,0.9);border:1px solid var(--line2);
  color:var(--text);border-radius:10px;padding:8px 12px;font:inherit;
}
label{cursor:pointer}

/* Scrollbar */
.sc::-webkit-scrollbar,.race-log::-webkit-scrollbar{height:6px;width:6px}
.sc::-webkit-scrollbar-thumb,.race-log::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.12);border-radius:3px}

@media(max-width:600px){
  .result-summary{grid-template-columns:1fr}
  .pilot-stats{grid-template-columns:repeat(2,1fr)}
  .cmp-row{grid-template-columns:1fr;gap:4px}
  .shell{padding:20px 14px 40px}
  .main-col{padding:18px 14px 36px}
  .splash-card{padding:28px 20px 24px;border-radius:22px}
}


/* F1-style icons (no emoji) */
.ic-svg{width:18px;height:18px;display:block;flex-shrink:0}
.ic-svg.weather{width:14px;height:14px;display:inline-block;vertical-align:-2px;margin-right:4px}
.side-nav button .ic{display:flex;width:22px;justify-content:center;opacity:0.75}
.side-nav button.on .ic{opacity:1;color:var(--a)}
.tip-bar{display:flex;align-items:flex-start;gap:10px}
.tip-ic{display:flex;margin-top:1px;color:var(--cyan);opacity:0.9}
.tip-ic .ic-svg{width:16px;height:16px}
.hero-badge .ic-svg{width:12px;height:12px;display:inline-block;vertical-align:-1px;margin-right:2px}
.captcha-label button{display:inline-flex;align-items:center;gap:6px}
.captcha-label button .ic-svg{width:13px;height:13px}
.win-mark{
  display:inline-flex;align-items:center;gap:4px;font-weight:700;color:var(--gold);
}
.win-mark::before{
  content:"";width:7px;height:7px;border-radius:1px;
  background:var(--gold);box-shadow:0 0 8px color-mix(in srgb,var(--gold) 50%,transparent);
  transform:rotate(45deg);
}
.next-mark{
  color:var(--cyan);font-weight:600;letter-spacing:0.04em;
}
.next-mark::before{
  content:"";display:inline-block;width:0;height:0;margin-right:6px;
  border-left:5px solid var(--cyan);border-top:4px solid transparent;border-bottom:4px solid transparent;
  vertical-align:middle;
}
.flag-sc,.flag-green{
  display:inline-block;font-size:10px;font-weight:800;letter-spacing:0.08em;
  padding:1px 5px;border-radius:3px;margin-right:4px;vertical-align:middle;
}
.flag-sc{background:#f5c542;color:#111}
.flag-green{background:#2ee6a0;color:#062}


/* F1 2D car stage */
.car-stage{
  padding:18px 16px 14px;margin-bottom:8px;
  background:linear-gradient(180deg,rgba(12,16,28,0.95),rgba(6,9,16,0.98));
  border:1px solid var(--line);border-radius:18px;
  box-shadow:inset 0 0 60px rgba(0,0,0,0.35);
}
.car-stage-hd{display:flex;justify-content:space-between;margin-bottom:8px;font-size:12px}
.f1car{width:100%;height:auto;display:block;max-height:260px}
.f1car .czone{transition:opacity 0.15s}
.f1car .czone:hover{opacity:0.92;filter:brightness(1.12)}
.car-legend{
  display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;justify-content:center;
}
.car-legend button{
  display:inline-flex;align-items:center;gap:8px;
  padding:8px 12px;font-size:12px;border-radius:100px;
  background:rgba(255,255,255,0.03);
}
.car-legend button i{
  width:8px;height:8px;border-radius:50%;display:inline-block;
  box-shadow:0 0 8px currentColor;
}

/* Upgrade modal */
.car-modal{
  position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;
  padding:20px;opacity:0;pointer-events:none;transition:opacity 0.22s ease;
}
.car-modal.show{opacity:1;pointer-events:auto}
.car-modal-bg{
  position:absolute;inset:0;background:rgba(2,4,10,0.72);
}
.car-modal-card{
  position:relative;z-index:1;width:min(480px,100%);
  background:linear-gradient(165deg,rgba(16,20,32,0.96),rgba(8,11,18,0.98));
  border:1px solid var(--line2);border-radius:22px;padding:22px 22px 20px;
  box-shadow:0 40px 100px rgba(0,0,0,0.65),0 0 0 1px color-mix(in srgb,var(--a) 20%,transparent);
  transform:translateY(12px) scale(0.97);transition:transform 0.28s var(--out);
}
.car-modal.show .car-modal-card{transform:none}
.car-modal-x{
  position:absolute;top:12px;right:12px;width:36px;height:36px;padding:0;
  border-radius:50%;font-size:14px;color:var(--muted);
}
.car-modal-preview{
  background:#060a12;border-radius:14px;padding:8px;margin-bottom:14px;
  border:1px solid var(--line);overflow:hidden;
}
.car-modal-preview .f1car{max-height:150px}
.car-modal-card h3{
  font-family:var(--display);font-size:18px;letter-spacing:0.06em;margin-bottom:6px;
}
.car-modal-stat{
  display:flex;justify-content:space-between;align-items:baseline;
  margin:14px 0 6px;font-size:13px;color:var(--muted);
}
.car-modal-stat strong{font-family:var(--display);font-size:22px;color:var(--text)}
.bar.big{height:10px;margin:8px 0 18px}
.car-modal-actions{display:flex;gap:10px;flex-wrap:wrap}
.car-modal-actions .p{flex:1;min-width:160px}


.team-mini{margin:0 -6px 10px;opacity:0.9;pointer-events:none}
.team-mini .f1car{max-height:72px}
.team-mini text{display:none}


.car-stage{
  padding:16px 12px 8px;margin:12px 0 8px;
  background:linear-gradient(180deg,#0c101a,#060910);
  border:1px solid var(--line);border-radius:18px;
  box-shadow:inset 0 -40px 80px rgba(0,0,0,0.35);
}
.car-stage-hd{display:flex;justify-content:space-between;padding:0 8px 4px;font-size:12px;font-weight:600}


.f1car-ref{
  position:relative;width:100%;max-width:920px;margin:0 auto;
  aspect-ratio:5/1;
  user-select:none;
}
.f1car-stack{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.f1car-img{width:100%;height:100%;object-fit:contain;display:block;position:relative;z-index:1;pointer-events:none}
.car-hots{position:absolute;inset:0;z-index:3}
.car-hot{
  position:absolute;border:1px dashed transparent;border-radius:10px;
  background:transparent;padding:0;cursor:pointer;
  display:flex;align-items:flex-start;justify-content:center;
  transition:background 0.2s,border-color 0.2s;
}
.car-hot span{
  opacity:0;transform:translateY(-4px);
  font-size:10px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;
  background:rgba(0,0,0,0.75);color:#fff;padding:3px 8px;border-radius:6px;
  pointer-events:none;transition:opacity 0.2s,transform 0.2s;
  margin-top:4px;
}
.car-hot:hover,.car-hot.on{
  background:color-mix(in srgb,var(--team) 18%,transparent);
  border-color:color-mix(in srgb,var(--team) 55%,transparent);
}
.car-hot:hover span,.car-hot.on span{opacity:1;transform:none}
.car-stage .f1car-ref{max-height:none}
.team-mini .f1car-ref{aspect-ratio:5/1;max-height:none}
.team-mini .car-hots{display:none}
.team-mini .f1car-img{opacity:0.95}

.f1car-svg{width:100%;height:auto;display:block;max-height:160px;filter:drop-shadow(0 8px 16px rgba(0,0,0,0.35))}

function carSVG(ti, hi){
  const col=T[ti][1];
  const gq = (typeof G!=='undefined'&&G&&G.gq!=null)?G.gq:(typeof window._gq!=='undefined'?window._gq:2);
  const animCls = gq>=1 ? 'car-anim' : '';
  const prem = gq>=2 ? 'car-premium' : '';
  // Shaped hotspot paths (percent of viewBox 0 0 800 425) — approx matching the model
  const parts = [
    // front wing (aéro)
    {k:'a', label:'Aéro', d:'M2 175 L95 155 L110 210 L100 280 L15 295 L2 250 Z', tip:'Aileron avant'},
    // nose + chassis front
    {k:'c', label:'Châssis', d:'M95 155 L280 140 L300 250 L110 280 Z', tip:'Nez & châssis'},
    // sidepod / body
    {k:'c', label:'Châssis', d:'M280 140 L480 130 L520 250 L300 250 Z', tip:'Sidepod'},
    // engine cover
    {k:'p', label:'Moteur', d:'M400 80 L560 70 L580 200 L420 210 Z', tip:'Capot moteur'},
    // rear wing
    {k:'a', label:'Aéro', d:'M620 40 L780 30 L790 200 L700 220 L620 180 Z', tip:'Aileron arrière'},
    // floor / reliability zone
    {k:'f', label:'Fiabilité', d:'M120 280 L650 270 L660 320 L110 330 Z', tip:'Fond plat & mécanique'},
  ];
  const hs = parts.map(p=>{
    const on = hi===p.k ? 'on' : '';
    return `<path class="car-hot-shape ${on}" data-part="${p.k}" d="${p.d}" onclick="event.stopPropagation();openPart('${p.k}')" title="${p.tip}"><title>${p.label} — ${p.tip}</title></path>`;
  }).join('');
  return `<div class="f1car-ref ${animCls} ${prem}" style="--team:${col}">
    <div class="f1car-stack">
      <div class="f1car-stage">
        <div class="f1car-color" style="background:${col}"></div>
        <img class="f1car-sil" alt="${T[ti][0]}" draggable="false" decoding="async" src="${CAR_BASE}">
        <svg class="f1car-hots-svg" viewBox="0 0 800 425" preserveAspectRatio="xMidYMid meet">
          ${hs}
        </svg>
      </div>
    </div>
  </div>`;
}

function openPart(k){
  const n={a:'Aérodynamique',p:'Moteur',c:'Châssis',f:'Fiabilité'};
  const desc={
    a:'Ailerons, diffuseur et flux d’air. Impact direct sur l’appui et la vitesse en courbe.',
    p:'Unité de puissance et récupération d’énergie. Détermine la pointe de vitesse.',
    c:'Structure, sidepods et rigidité. Équilibre et comportement global.',
    f:'Fiabilité mécanique et refroidissement. Réduit les risques d’abandon.'
  };
  const c=G.car[G.t], cost=Math.round(4+(c[k]-55)*.3);
  const col=T[G.t][1];
  const maxed=c[k]>=99, poor=G.$<cost;
  let modal=$('#carModal');
  if(!modal){
    modal=document.createElement('div');modal.id='carModal';modal.className='car-modal';
    document.body.appendChild(modal);
  }
  modal.innerHTML=`<div class="car-modal-bg" onclick="closePart()"></div>
  <div class="car-modal-card" style="--a:${col}">
    <button class="car-modal-x" onclick="closePart()">✕</button>
    <div class="car-modal-preview">${carSVG(G.t,k)}</div>
    <h3>${n[k]}</h3>
    <p class="mut">${desc[k]}</p>
    <div class="car-modal-stat"><span>Niveau</span><strong>${c[k]} / 99</strong></div>
    <div class="bar big"><i style="width:${c[k]}%"></i></div>
    <div class="car-modal-actions">
      <button class="p" ${maxed||poor?'disabled':''} onclick="upgradePart('${k}')">${maxed?'Niveau max':poor?'Budget insuffisant':`Améliorer +2 · ${cost} M$`}</button>
      <button class="ghost" onclick="closePart()">Fermer</button>
    </div>
  </div>`;
  requestAnimationFrame(()=>modal.classList.add('show'));
}
function closePart(){
  const m=$('#carModal');if(!m)return;
  m.classList.remove('show');
  setTimeout(()=>m.remove(),220);
}
function upgradePart(k){
  const before=G.car[G.t][k];
  up(k);
  if(G.car[G.t][k]===before)return;
  sfx('up');
  hub('eq');
  openPart(k);
}

let CAP='';
function genCaptcha(){
  const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  CAP='';
  for(let i=0;i<5;i++) CAP+=chars[Math.floor(Math.random()*chars.length)];
  const cv=$('#captchaCv'); if(!cv) return;
  const dpr=Math.min(2,window.devicePixelRatio||1);
  const w=cv.clientWidth||320, h=64;
  cv.width=w*dpr; cv.height=h*dpr;
  cv.style.height=h+'px';
  const ctx=cv.getContext('2d');
  ctx.scale(dpr,dpr);
  // bg
  ctx.fillStyle='#0b0f16';
  ctx.fillRect(0,0,w,h);
  // noise dots
  for(let i=0;i<120;i++){
    ctx.fillStyle=`rgba(${80+Math.random()*100},${80+Math.random()*80},${100+Math.random()*80},${0.15+Math.random()*0.25})`;
    ctx.fillRect(Math.random()*w,Math.random()*h,1.5,1.5);
  }
  // lines
  for(let i=0;i<5;i++){
    ctx.strokeStyle=`rgba(46,230,214,${0.08+Math.random()*0.12})`;
    ctx.beginPath();
    ctx.moveTo(Math.random()*w,Math.random()*h);
    ctx.bezierCurveTo(Math.random()*w,Math.random()*h,Math.random()*w,Math.random()*h,Math.random()*w,Math.random()*h);
    ctx.stroke();
  }
  for(let i=0;i<3;i++){
    ctx.strokeStyle=`rgba(225,6,0,${0.1+Math.random()*0.15})`;
    ctx.beginPath();
    ctx.moveTo(0,Math.random()*h);
    ctx.lineTo(w,Math.random()*h);
    ctx.stroke();
  }
  // text
  const step=w/(CAP.length+1);
  for(let i=0;i<CAP.length;i++){
    const x=step*(i+0.55)+ (Math.random()*8-4);
    const y=h/2+ (Math.random()*10-5);
    ctx.save();
    ctx.translate(x,y);
    ctx.rotate((Math.random()-0.5)*0.45);
    ctx.font=`bold ${22+Math.random()*6}px Orbitron,monospace`;
    ctx.textAlign='center';
    ctx.textBaseline='middle';
    // shadow
    ctx.fillStyle='rgba(225,6,0,0.35)';
    ctx.fillText(CAP[i],2,2);
    ctx.fillStyle=Math.random()>0.3?'#eef1f6':'#2ee6d6';
    ctx.fillText(CAP[i],0,0);
    ctx.restore();
  }
}
function refreshCaptcha(){
  genCaptcha();
  const inp=$('#capIn'); if(inp){inp.value='';inp.classList.remove('bad');inp.focus()}
  const err=$('#capErr'); if(err) err.classList.remove('show');
}
function checkCaptcha(){
  const inp=$('#capIn');
  const err=$('#capErr');
  if(!inp) return;
  const v=(inp.value||'').replace(/\s/g,'').toUpperCase();
  if(v.length<4){
    inp.classList.add('bad');
    if(err){err.textContent='Saisis le code complet.';err.classList.add('show')}
    sfx&&G&&G.sfx?null:null;
    try{const a=window.AudioContext||window.webkitAudioContext;if(a){/* soft warn without G */}}catch(e){}
    return;
  }
  if(v!==CAP){
    inp.classList.add('bad');
    if(err){err.textContent='Code incorrect — réessaie.';err.classList.add('show')}
    // play warn via temp
    try{
      const AC=new(window.AudioContext||window.webkitAudioContext)();
      const o=AC.createOscillator(),g=AC.createGain();
      o.type='square';o.frequency.value=160;o.connect(g);g.connect(AC.destination);
      g.gain.setValueAtTime(.04,AC.currentTime);
      g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+.18);
      o.start();o.stop(AC.currentTime+.2);
    }catch(e){}
    setTimeout(refreshCaptcha,450);
    return;
  }
  // success — lights sequence then enter
  const lights=$('#splLights');
  if(lights){
    lights.classList.remove('green');
    const dots=[...lights.querySelectorAll('i')];
    dots.forEach(d=>d.classList.remove('on'));
    let i=0;
    const iv=setInterval(()=>{
      if(i<dots.length){dots[i].classList.add('on');i++}
      else{
        clearInterval(iv);
        lights.classList.add('green');
        dots.forEach(d=>d.classList.add('on'));
        setTimeout(()=>{
          document.body.classList.add('splash-out');
          setTimeout(()=>{document.body.classList.remove('splash-out');pageFlash(()=>modeSelect())},300);
        },420);
      }
    },160);
  } else {
    modeSelect();
  }
  try{
    const AC=new(window.AudioContext||window.webkitAudioContext)();
    [[523,0],[659,.1],[784,.2]].forEach(([f,d])=>{
      const o=AC.createOscillator(),g=AC.createGain();
      o.connect(g);g.connect(AC.destination);o.frequency.value=f;
      g.gain.setValueAtTime(.05,AC.currentTime+d);
      g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d+.2);
      o.start(AC.currentTime+d);o.stop(AC.currentTime+d+.22);
    });
  }catch(e){}
}

function bootParticles(host){
  if(!host||LITE) return;
  const cv=document.createElement('canvas');
  cv.className='ambient-cv';
  host.appendChild(cv);
  const ctx=cv.getContext('2d');
  let w,h,parts=[],raf;
  const dpr=Math.min(devicePixelRatio||1,1.5);const resize=()=>{w=cv.width=host.clientWidth*dpr;h=cv.height=host.clientHeight*dpr;cv.style.width=host.clientWidth+'px';cv.style.height=host.clientHeight+'px';ctx.setTransform(dpr,0,0,dpr,0,0)};
  const reset=()=>{parts=Array.from({length:24},()=>({x:Math.random()*host.clientWidth,y:Math.random()*host.clientHeight,r:0.4+Math.random()*1.8,vx:(Math.random()-0.5)*0.25,vy:-0.15-Math.random()*0.35,a:0.08+Math.random()*0.22}))};
  const tick=()=>{
    if(!host.isConnected){cancelAnimationFrame(raf);return}
    ctx.clearRect(0,0,host.clientWidth,host.clientHeight);
    for(const p of parts){
      p.x+=p.vx;p.y+=p.vy;
      if(p.y<-4){p.y=host.clientHeight+4;p.x=Math.random()*host.clientWidth}
      if(p.x<0)p.x=host.clientWidth;if(p.x>host.clientWidth)p.x=0;
      ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fillStyle=`rgba(255,255,255,${p.a})`;ctx.fill();
    }
    raf=requestAnimationFrame(tick);
  };
  resize();reset();tick();
  const ro=new ResizeObserver(()=>{resize()});ro.observe(host);
  return ()=>{cancelAnimationFrame(raf);ro.disconnect();cv.remove()};
}
function pageFlash(cb){
  const o=document.createElement('div');o.className='page-flash';document.body.appendChild(o);
  requestAnimationFrame(()=>o.classList.add('on'));
  setTimeout(()=>{try{cb&&cb()}catch(e){}},180);
  setTimeout(()=>o.remove(),520);
}
